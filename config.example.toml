# mcp-lazy Example Catalog
# ------------------------
# This file contains a comprehensive list of popular MCP servers.
# Add or remove servers as needed. None of these cost context tokens until explicitly loaded!

# --- Dev Tooling ---

[[servers]]
name = "filesystem"
description = "Secure file operations (read, write, list) on local directories"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/dir"]

[[servers]]
name = "git"
description = "Git operations: status, commit, push, branch management"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-git"]

[[servers]]
name = "github"
description = "GitHub operations: manage repos, issues, and PRs"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PERSONAL_ACCESS_TOKEN}" }

[[servers]]
name = "fetch"
description = "Fetch and convert web pages to clean markdown"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-fetch"]

# --- Data & Infra ---

[[servers]]
name = "supabase"
description = "Query and manage Supabase projects (tables, RLS, storage, auth)"
command = "npx"
args = ["-y", "@supabase/mcp-server-supabase"]
env = { SUPABASE_ACCESS_TOKEN = "${SUPABASE_ACCESS_TOKEN}" }
auto_unload_after_idle_secs = 600

[[servers]]
name = "postgres"
description = "Run read-only SQL queries on a PostgreSQL database"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "${POSTGRES_URL}"]

[[servers]]
name = "sqlite"
description = "Run SQL queries on a local SQLite database"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sqlite", "database.db"]

[[servers]]
name = "sentry"
description = "Fetch and analyze Sentry issues and traces"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sentry"]
env = { SENTRY_AUTH_TOKEN = "${SENTRY_AUTH_TOKEN}" }

# --- Browser & Automation ---

[[servers]]
name = "playwright"
description = "Browser automation: navigate, click, screenshot"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-playwright"]
auto_unload_after_idle_secs = 300

[[servers]]
name = "puppeteer"
description = "Headless browser automation via Puppeteer"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-puppeteer"]

# --- Productivity & Comms ---

[[servers]]
name = "slack"
description = "Send and read messages in Slack channels"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
env = { SLACK_BOT_TOKEN = "${SLACK_BOT_TOKEN}" }

[[servers]]
name = "notion"
description = "Read and write Notion pages and databases"
command = "npx"
args = ["-y", "mcp-server-notion"]
env = { NOTION_API_KEY = "${NOTION_API_KEY}" }

[[servers]]
name = "linear"
description = "Manage Linear issues, projects, and cycles"
command = "npx"
args = ["-y", "@linear/mcp-server"]
env = { LINEAR_API_KEY = "${LINEAR_API_KEY}" }

# --- Search & Knowledge ---

[[servers]]
name = "brave-search"
description = "Web search via Brave Search API"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "${BRAVE_API_KEY}" }

[[servers]]
name = "memory"
description = "Simple graph-based memory and knowledge graph"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
